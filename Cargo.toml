[package]
name = "sigmaos-gpu"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "GPU and graphics subsystem"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-gpu"
readme = "README.md"
keywords = ["gpu", "graphics", "drm"]
